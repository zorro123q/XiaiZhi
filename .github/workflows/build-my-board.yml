name: Build My Board

# 手动触发：Actions 页面点 Run workflow，填板子名
# 推送触发：main 有更新就自动编一次 esp-sparkbot（公开仓库 Actions 免费）
on:
  workflow_dispatch:
    inputs:
      board:
        description: '板子名（默认 esp-sparkbot）'
        required: true
        default: 'esp-sparkbot'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    env:
      BOARD: ${{ inputs.board || 'esp-sparkbot' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py "$BOARD"

      - name: Upload merged bin
        uses: actions/upload-artifact@v6
        with:
          name: xiaozhi-${{ env.BOARD }}-merged
          path: build/merged-binary.bin
          if-no-files-found: error

      # 只有 app 的镜像：烧到 0x100000（ota_0）即可，不动 nvs/model 分区，
      # 所以不会丢 WiFi 配置、转向标定、音量。日常改代码用这个，别整片烧。
      # 前提：分区表没变（合并镜像 0x0 起会把 nvs 一起覆盖）。
      - name: Upload app-only bin
        uses: actions/upload-artifact@v6
        with:
          name: xiaozhi-${{ env.BOARD }}-app
          path: build/xiaozhi.bin
          if-no-files-found: warn
