name: Build My Board

# 手动触发：在 GitHub 页面点 "Run workflow"，填板子名即可
on:
  workflow_dispatch:
    inputs:
      board:
        description: '板子名（从 scripts/release.py --list-boards 里选，例如 atoms3r-cam-m12-echo-base）'
        required: true
        default: 'bread-compact-wifi'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ inputs.board }}
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py ${{ inputs.board }}

      - name: Upload merged bin
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-${{ inputs.board }}-merged
          path: build/merged-binary.bin
          if-no-files-found: error
